name: PR

on:
  pull_request:
    branches:
      - main

jobs:
  pr:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Compute node modules cache key
        id: nodeModulesCacheKey
        run: echo "value=$(node packages/build/src/computeNodeModulesCacheKey.js)" >> $GITHUB_OUTPUT
        shell: bash
      - uses: actions/cache@v6
        id: npm-cache
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-cacheNodeModules-${{ steps.nodeModulesCacheKey.outputs.value }}
      - name: npm ci
        run: npm ci
        if: steps.npm-cache.outputs.cache-hit != 'true'
      - run: npm run build
      - run: npm run build:static
      - run: npm test
      - run: npm run type-check
      - run: npm run lint
      - name: install playwright system dependencies
        working-directory: ./packages/e2e
        if: runner.os == 'Linux'
        run: sudo npx playwright install-deps chromium firefox webkit
      - name: install playwright dependencies
        working-directory: ./packages/e2e
        run: npx playwright install chromium firefox webkit
        if: steps.npm-cache.outputs.cache-hit != 'true'
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: e2e
        working-directory: ./packages/e2e
        run: npm run e2e:headless
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: e2e firefox
        working-directory: ./packages/e2e
        run: npm run e2e:firefox:headless
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: e2e webkit
        if: runner.os != 'Windows'
        working-directory: ./packages/e2e
        run: npm run e2e:webkit:headless
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: measure
        working-directory: ./packages/build
        run: npm run measure
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0

  electron:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run build
      - uses: actions/checkout@v7
        with:
          repository: lvce-editor/lvce-editor
          ref: 6bf8290ca4c13fbab48893cc85442480f97a0593
          path: .tmp/electron-application
      - name: Install matching application runtime
        working-directory: .tmp/electron-application
        run: npm ci
      - name: Install Electron
        working-directory: .tmp/electron-application
        run: node node_modules/electron/install.js
      - name: Install Electron system dependencies
        if: runner.os == 'Linux'
        working-directory: .tmp/electron-application
        run: npx playwright install-deps chromium
      - name: Test moving tabs into Electron windows (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node packages/e2e-integration/scripts/test-move-to-new-window.mjs .tmp/electron-application
        env:
          LVCE_MOVE_EVIDENCE_DIR: .tmp/electron-evidence
      - name: Test moving tabs into Electron windows
        if: runner.os != 'Linux'
        run: node packages/e2e-integration/scripts/test-move-to-new-window.mjs .tmp/electron-application
        env:
          LVCE_MOVE_EVIDENCE_DIR: .tmp/electron-evidence
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: electron-move-${{ matrix.os }}
          path: .tmp/electron-evidence
          if-no-files-found: warn
