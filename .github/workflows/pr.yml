name: PR

on:
  pull_request:
    branches:
      - main

jobs:
  pr:
    name: pr (${{ matrix.os }}, attempt ${{ matrix.attempt }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            attempt: 1
          - os: macos-15
            attempt: 1
          - os: windows-2025
            attempt: 1
          - os: windows-2025
            attempt: 2
          - os: windows-2025
            attempt: 3
          - os: windows-2025
            attempt: 4
          - os: windows-2025
            attempt: 5
          - os: windows-2025
            attempt: 6
          - os: windows-2025
            attempt: 7
          - os: windows-2025
            attempt: 8
          - os: windows-2025
            attempt: 9
          - os: windows-2025
            attempt: 10
          - os: windows-2025
            attempt: 11
          - os: windows-2025
            attempt: 12
          - os: windows-2025
            attempt: 13
          - os: windows-2025
            attempt: 14
          - os: windows-2025
            attempt: 15
          - os: windows-2025
            attempt: 16
          - os: windows-2025
            attempt: 17
          - os: windows-2025
            attempt: 18
          - os: windows-2025
            attempt: 19
          - os: windows-2025
            attempt: 20
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Compute node modules cache key
        id: nodeModulesCacheKey
        run: echo "value=$(node packages/build/src/computeNodeModulesCacheKey.js)" >> $GITHUB_OUTPUT
        shell: bash
      - uses: actions/cache@v6
        id: npm-cache
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-cacheNodeModules-${{ steps.nodeModulesCacheKey.outputs.value }}
      - name: npm ci
        run: npm ci
        if: steps.npm-cache.outputs.cache-hit != 'true'
      - run: npm run build
      - run: npm run build:static
      - run: npm test
      - run: npm run type-check
      - name: install playwright system dependencies
        working-directory: ./packages/e2e
        if: runner.os == 'Linux'
        run: sudo npx playwright install-deps chromium firefox webkit
      - name: install playwright dependencies
        working-directory: ./packages/e2e
        run: npx playwright install chromium firefox webkit
        if: steps.npm-cache.outputs.cache-hit != 'true'
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: e2e
        working-directory: ./packages/e2e
        run: npm run e2e:headless -- --filter=editor-layout-menu --trace-renderer-worker
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: e2e firefox
        working-directory: ./packages/e2e
        run: npm run e2e:firefox:headless
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: e2e webkit
        if: runner.os != 'Windows'
        working-directory: ./packages/e2e
        run: npm run e2e:webkit:headless
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: measure
        working-directory: ./packages/build
        run: npm run measure
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: Upload e2e artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.os }}-${{ matrix.attempt }}
          path: |
            packages/e2e/screenshots/**
            packages/e2e/test-results/**
            packages/e2e/renderer-worker-traces/**
          if-no-files-found: ignore
      - run: npm run lint
        if: always()
